<style>


/* ==============================
   GENERAL LAYOUT
   ============================== */

body {

  font-family: Arial, sans-serif;

  margin: 0;

  padding: 5px;

  background: #f5f5f5;

  overflow-y: auto;
  overflow-x: hidden;

}


.review-container {

  width: 100%;

  background: white;

  padding: 8px;

  box-sizing: border-box;

}


h3,
h4 {

  margin: 4px 0;

  font-size: 13px;

}


/* ==============================
   BUTTONS
   ============================== */

button {

  cursor: pointer;

  border: none;

  border-radius: 4px;

  padding: 6px 12px;

  font-size: 12px;

}


button:hover {

  opacity: 0.85;

}


/* ==============================
   IMAGE REVIEW AREA
   ============================== */

.image-review-area {

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 10px;

  width: 100%;

  height: 360px;

}


.image-section {

  flex: 1;

  height: 100%;

  display: flex;

  align-items: center;

  justify-content: center;

}


.image-preview {

  max-width: 100%;

  max-height: 100%;

  object-fit: contain;

  background: #222;

  border-radius: 4px;

  box-sizing: border-box;

}


/* Previous / Next buttons */

.image-review-area button {

  width: 35px;

  height: 35px;

  padding: 0;

  flex-shrink: 0;

  border-radius: 50%;

  font-size: 18px;

}


.image-toolbar {

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 16px;

  margin: 5px 0 10px;

}


.image-counter {

  font-size: 14px;

  font-weight: bold;

}


/* ==============================
   METADATA
   ============================== */


.metadata-section {

  margin-bottom:6px;

}


.metadata-grid {

  display:grid;
  grid-template-columns:
  repeat(4,1fr);

  gap:6px;

}


.metadata-grid div {

  background:#f0f0f0;
  padding:5px;
  border-radius:4px;

}


.metadata-grid label {

  display:block;

  font-size:11px;
  font-weight:bold;

  margin-bottom:2px;

}


.metadata-grid span {

  font-size:12px;

}

/* ==============================
   CREATIVE REVIEW
   ============================== */


.grading-section {

  margin-bottom:6px;

}


.review-fields {

  display:grid;

  grid-template-columns:
  repeat(4,1fr);

  gap:6px;

}


.review-fields label {

  font-size:11px;

  font-weight:bold;

}


select {

  width:100%;

  padding:3px 5px;

  font-size:12px;

  height:28px;

}

/* ==============================
   CHECKBOXES
   ============================== */


.checkbox-section {

  margin-bottom:6px;

}


.checkbox-section h4 {

  margin-bottom:4px;

}


.checkbox-section label {

  display:inline-block;

  margin-right:15px;

  font-size:12px;

}


input[type="checkbox"] {

  margin-right:4px;

}


/* ==============================
   TEXT AREAS
   ============================== */


.caption-section,
.notes-section {

  margin-bottom:6px;

}


.caption-section h4,
.notes-section h4 {

  margin-bottom:3px;

}


textarea {

  width:100%;

  height:35px;

  padding:5px;

  resize:none;

  font-size:12px;

  box-sizing:border-box;

}


/* ==============================
   FILE NAME
   ============================== */


.file-section {

  text-align:center;

  margin-top:5px;

  opacity:0.45;

}


.file-section h4 {

  margin:0;

  font-size:11px;

  font-weight:normal;

}


</style>
