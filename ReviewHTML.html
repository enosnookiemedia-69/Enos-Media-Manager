<!DOCTYPE html>
<html>

<head>

  <base target="_top">

  <?!= include('StylesHTML'); ?>

</head>


<body>


<div class="review-container">


  <!-- ======================================================
       IMAGE + NAVIGATION AREA
       ====================================================== -->

  <div class="image-review-area">


    <button
      id="previousButton"
      type="button"
    >
      ◀
    </button>


    <div class="image-section">


      <div
        id="imageLoading"
        class="image-loading"
      >
        Loading image...
      </div>


      <img
        id="imagePreview"
        src=""
        alt="Image Preview"
        class="image-preview"
      >


      <div
        id="imageError"
        class="image-error"
      >
        Image could not be displayed.
      </div>


    </div>


    <button
      id="nextButton"
      type="button"
    >
      ▶
    </button>


  </div>


  <!-- ======================================================
       IMAGE TOOLBAR
       ====================================================== -->


  <div class="image-toolbar">


    <div class="image-counter">

      Image

      <span id="imageNumber">
        1
      </span>

      of

      <span id="imageTotal">
        0
      </span>

    </div>


    <button
      id="saveButton"
      type="button"
    >
      Save
    </button>


    <span id="saveStatus"></span>


  </div>


  <!-- ======================================================
       CREATIVE REVIEW
       ====================================================== -->


  <div class="grading-section">


    <h4>
      Creative Review
    </h4>


    <div class="review-fields">


      <label>

        Grade

        <select id="grade">

          <option value=""></option>
          <option value="S">S</option>
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
          <option value="D">D</option>

        </select>

      </label>


      <label>

        Story Value

        <select id="storyValue">

          <option value=""></option>
          <option value="5">5</option>
          <option value="4">4</option>
          <option value="3">3</option>
          <option value="2">2</option>
          <option value="1">1</option>

        </select>

      </label>


      <label>

        Layout

        <select id="layoutSuitability">

          <option value=""></option>

          <option value="Dual Page Spread">
            Dual Page Spread
          </option>

          <option value="Single Page Dual Landscape">
            Single Page Dual Landscape
          </option>

          <option value="Single Page Landscape">
            Single Page Landscape
          </option>

          <option value="Single Page Dual Portrait">
            Single Page Dual Portrait
          </option>

          <option value="Portrait">
            Portrait
          </option>

        </select>

      </label>


      <label>

        Print

        <select id="printSuitability">

          <option value=""></option>

          <option value="Excellent">
            Excellent
          </option>

          <option value="Good">
            Good
          </option>

          <option value="Acceptable">
            Acceptable
          </option>

          <option value="Poor">
            Poor
          </option>

        </select>

      </label>


    </div>


  </div>


  <!-- ======================================================
       SELECTION
       ====================================================== -->


  <div class="checkbox-section">


    <h4>
      Selection
    </h4>


    <div class="checkbox-options">


      <label>

        <input
          type="checkbox"
          id="heroImage"
        >

        Hero Image

      </label>


      <label>

        <input
          type="checkbox"
          id="finalBook"
        >

        Final Book

      </label>


    </div>


  </div>


  <!-- ======================================================
       METADATA
       ====================================================== -->


  <div class="metadata-section">


    <h4>
      Metadata
    </h4>


    <div class="metadata-grid">


      <div>

        <label>
          Year
        </label>

        <span id="year"></span>

      </div>


      <div>

        <label>
          Photographer
        </label>

        <span id="photographer"></span>

      </div>


      <div>

        <label>
          Camera
        </label>

        <span id="camera"></span>

      </div>


      <div>

        <label>
          Category
        </label>

        <select id="category">

          <option value=""></option>

          <option value="Cover">
            Cover
          </option>

          <option value="Where's Enos?">
            Where's Enos?
          </option>

          <option value="Setup & Workshop">
            Setup & Workshop
          </option>

          <option value="Build Onsite">
            Build Onsite
          </option>

          <option value="Jollers & People">
            Jollers & People
          </option>

          <option value="Artworks & Burns">
            Artworks & Burns
          </option>

          <option value="Landscapes & Nature">
            Landscapes & Nature
          </option>

          <option value="Nightlife & DJs">
            Nightlife & DJs
          </option>

          <option value="Strike & Packing">
            Strike & Packing
          </option>

          <option value="Portraits & Extras">
            Portraits & Extras
          </option>

        </select>

      </div>


    </div>


  </div>


  <!-- ======================================================
       CAPTION
       ====================================================== -->


  <div class="caption-section">

    <h4>
      Caption
    </h4>

    <textarea
      id="caption"
      placeholder="Book caption..."
    ></textarea>

  </div>


  <!-- ======================================================
       NOTES
       ====================================================== -->


  <div class="notes-section">

    <h4>
      Notes
    </h4>

    <textarea
      id="notes"
      placeholder="Editing notes..."
    ></textarea>

  </div>


  <!-- ======================================================
       FILE INFORMATION
       ====================================================== -->


  <div class="file-section">

    <h4 id="fileName">
      Loading...
    </h4>

  </div>


</div>


<script>


// ==========================================================
// START REVIEWER
// ==========================================================

document.addEventListener(
  "DOMContentLoaded",
  function() {

    console.log(
      "Reviewer started"
    );

    loadCurrentImage();

  }
);


// ==========================================================
// LOAD CURRENT IMAGE
// ==========================================================

function loadCurrentImage() {

  showLoadingState();


  google.script.run

    .withSuccessHandler(
      populateReview
    )

    .withFailureHandler(
      handleError
    )

    .getCurrentReviewImage();

}


// ==========================================================
// SHOW LOADING STATE
// ==========================================================

function showLoadingState() {

  const image =
    document.getElementById(
      "imagePreview"
    );


  const fileName =
    document.getElementById(
      "fileName"
    );


  if (image) {

    image.style.opacity =
      "0.35";

  }


  if (fileName) {

    fileName.innerText =
      "Loading image...";

  }

}


// ==========================================================
// POPULATE REVIEW
// ==========================================================

function populateReview(data) {

  console.log(
    "Review data:",
    data
  );


  if (!data) {

    handleError({
      message:
        "No review data was returned."
    });

    return;

  }


  // --------------------------------------------------------
  // IMAGE
  // --------------------------------------------------------

  const image =
    document.getElementById(
      "imagePreview"
    );


  if (!image) {

    handleError({
      message:
        "Image preview element not found."
    });

    return;

  }


  image.onload =
    function() {

      console.log(
        "Image loaded successfully."
      );

      image.style.opacity =
        "1";

    };


  image.onerror =
    function() {

      console.error(
        "Image failed to load:",
        data.imageUrl
      );


      image.style.opacity =
        "1";


      document.getElementById(
        "saveStatus"
      ).innerText =
        "Image could not be loaded from Google Drive.";

    };


  image.src =
    data.imageUrl || "";


  // --------------------------------------------------------
  // FILE NAME
  // --------------------------------------------------------

  document
    .getElementById("fileName")
    .innerText =
      data.fileName || "";


  // --------------------------------------------------------
  // IMAGE COUNTER
  // --------------------------------------------------------
  //
  // Spreadsheet row 2 is Image 1.
  //
  // Therefore:
  //
  // imageNumber = row - 1
  //
  // --------------------------------------------------------

  document
    .getElementById("imageNumber")
    .innerText =
      Math.max(
        1,
        (data.row || 2) - 1
      );


  document
    .getElementById("imageTotal")
    .innerText =
      data.total || "";


  // --------------------------------------------------------
  // METADATA
  // --------------------------------------------------------

  const metadata =
    data.metadata || {};


  document
    .getElementById("year")
    .innerText =
      metadata.year || "";


  document
    .getElementById("photographer")
    .innerText =
      metadata.photographer || "";


  document
    .getElementById("camera")
    .innerText =
      metadata.camera || "";


  document
    .getElementById("category")
    .value =
      metadata.category || "";


  // --------------------------------------------------------
  // CREATIVE REVIEW
  // --------------------------------------------------------

  const creative =
    data.creative || {};


  document
    .getElementById("grade")
    .value =
      creative.grade || "";


  document
    .getElementById("storyValue")
    .value =
      creative.storyValue || "";


  document
    .getElementById("layoutSuitability")
    .value =
      creative.layoutSuitability || "";


  document
    .getElementById("printSuitability")
    .value =
      creative.printSuitability || "";


  // --------------------------------------------------------
  // SELECTION
  // --------------------------------------------------------

  document
    .getElementById("heroImage")
    .checked =
      creative.heroImage === true;


  document
    .getElementById("finalBook")
    .checked =
      creative.finalBook === true;


  // --------------------------------------------------------
  // CAPTION
  // --------------------------------------------------------

  document
    .getElementById("caption")
    .value =
      creative.caption || "";


  // --------------------------------------------------------
  // NOTES
  // --------------------------------------------------------

  document
    .getElementById("notes")
    .value =
      creative.notes || "";


  console.log(
    "Reviewer populated successfully."
  );

}


// ==========================================================
// SAVE
// ==========================================================

document
  .getElementById("saveButton")
  .addEventListener(
    "click",
    saveCurrentReview
  );


// ==========================================================
// SAVE CURRENT REVIEW
// ==========================================================

function saveCurrentReview() {

  const saveButton =
    document.getElementById(
      "saveButton"
    );


  const saveStatus =
    document.getElementById(
      "saveStatus"
    );


  if (
    saveButton.disabled
  ) {

    return;

  }


  // --------------------------------------------------------
  // COLLECT REVIEW DATA
  // --------------------------------------------------------

  const reviewData = {

    grade:
      document
        .getElementById("grade")
        .value,


    storyValue:
      document
        .getElementById("storyValue")
        .value,


    layoutSuitability:
      document
        .getElementById("layoutSuitability")
        .value,


    printSuitability:
      document
        .getElementById("printSuitability")
        .value,


    category:
      document
        .getElementById("category")
        .value,


    heroImage:
      document
        .getElementById("heroImage")
        .checked,


    finalBook:
      document
        .getElementById("finalBook")
        .checked,


    caption:
      document
        .getElementById("caption")
        .value,


    notes:
      document
        .getElementById("notes")
        .value

  };


  console.log(
    "Saving review:",
    reviewData
  );


  saveButton.innerText =
    "Saving...";


  saveButton.disabled =
    true;


  saveStatus.innerText =
    "";


  // --------------------------------------------------------
  // SEND TO APPS SCRIPT
  // --------------------------------------------------------

  google.script.run

    .withSuccessHandler(
      function(result) {

        console.log(
          "Review saved:",
          result
        );


        saveButton.innerText =
          "✓ Saved";


        saveStatus.innerText =
          "Changes stored";


        setTimeout(
          function() {

            saveButton.disabled =
              false;

            saveButton.innerText =
              "Save";

          },
          1000
        );

      }
    )


    .withFailureHandler(
      function(error) {

        console.error(
          "Save failed:",
          error
        );


        saveButton.disabled =
          false;


        saveButton.innerText =
          "Save";


        saveStatus.innerText =
          error &&
          error.message
            ? error.message
            : "Save failed";

      }
    )


    .saveReview(
      reviewData
    );

}


// ==========================================================
// NEXT IMAGE
// ==========================================================

document
  .getElementById("nextButton")
  .addEventListener(
    "click",
    function() {

      const nextButton =
        document.getElementById(
          "nextButton"
        );


      nextButton.disabled =
        true;


      document.getElementById(
        "saveStatus"
      ).innerText =
        "Loading...";


      google.script.run

        .withSuccessHandler(
          function(data) {

            nextButton.disabled =
              false;


            document
              .getElementById(
                "saveButton"
              )
              .innerText =
                "Save";


            document
              .getElementById(
                "saveButton"
              )
              .disabled =
                false;


            document
              .getElementById(
                "saveStatus"
              )
              .innerText =
                "";


            populateReview(
              data
            );

          }
        )


        .withFailureHandler(
          function(error) {

            nextButton.disabled =
              false;


            handleError(
              error
            );

          }
        )


        .nextReviewImage();

    }
  );


// ==========================================================
// PREVIOUS IMAGE
// ==========================================================

document
  .getElementById("previousButton")
  .addEventListener(
    "click",
    function() {

      const previousButton =
        document.getElementById(
          "previousButton"
        );


      previousButton.disabled =
        true;


      document.getElementById(
        "saveStatus"
      ).innerText =
        "Loading...";


      google.script.run

        .withSuccessHandler(
          function(data) {

            previousButton.disabled =
              false;


            document
              .getElementById(
                "saveButton"
              )
              .innerText =
                "Save";


            document
              .getElementById(
                "saveButton"
              )
              .disabled =
                false;


            document
              .getElementById(
                "saveStatus"
              )
              .innerText =
                "";


            populateReview(
              data
            );

          }
        )


        .withFailureHandler(
          function(error) {

            previousButton.disabled =
              false;


            handleError(
              error
            );

          }
        )


        .previousReviewImage();

    }
  );


// ==========================================================
// ERROR HANDLING
// ==========================================================

function handleError(error) {

  console.error(
    "Reviewer error:",
    error
  );


  const saveStatus =
    document.getElementById(
      "saveStatus"
    );


  if (
    error &&
    error.message
  ) {

    saveStatus.innerText =
      error.message;

  }

  else {

    saveStatus.innerText =
      "An unexpected error occurred.";

  }

}


</script>


</body>

</html>
