<!DOCTYPE html>
<html>

<head>
  <base target="_top">
  <?!= include('StylesHTML'); ?>
</head>

<body>

<div class="review-container">


 

<!-- IMAGE + NAVIGATION AREA -->

<div class="image-review-area">


  <button id="previousButton">
    ◀
  </button>


  <div class="image-section">

    <img 
      id="imagePreview"
      src=""
      alt="Image Preview"
      class="image-preview"
    >

  </div>


  <button id="nextButton">
    ▶
  </button>


</div>


<div class="image-toolbar">


  <div class="image-counter">

    Image 
    <span id="imageNumber">1</span>
    of
    <span id="imageTotal">1265</span>

  </div>


  <button id="saveButton">
    Save
  </button>


  <span id="saveStatus">
  </span>


</div>


 

  <!-- GRADING AREA -->

<div class="grading-section">

  <h4>Creative Review</h4>


  <div class="review-fields">


    <label>
      Grade
      <select id="grade">
        <option></option>
        <option>S</option>
        <option>A</option>
        <option>B</option>
        <option>C</option>
        <option>D</option>
      </select>
    </label>


<label>
  Selection
  <select id="selectionStage">
    <option></option>
    <option>Unreviewed</option>
    <option>Reviewed</option>
    <option>Shortlisted</option>
    <option>Final Selection</option>
    <option>Rejected</option>
  </select>
</label>


    <label>
      Story Value
      <select id="storyValue">
        <option></option>
        <option>5</option>
        <option>4</option>
        <option>3</option>
        <option>2</option>
        <option>1</option>
      </select>
    </label>


<label>
  Layout
  <select id="layoutSuitability">

    <option value=""></option>

    <option value="Hero">
      Hero — Cover or chapter opener
    </option>

    <option value="Double Spread">
      Double Spread — Across two pages
    </option>

    <option value="Full Page">
      Full Page — Single page feature
    </option>

    <option value="Half Page">
      Half Page — Shared page layout
    </option>

    <option value="Quarter Page">
      Quarter Page — Supporting image
    </option>

  </select>
</label>


    <label>
      Print
      <select id="printSuitability">
        <option></option>
        <option>Excellent</option>
        <option>Good</option>
        <option>Acceptable</option>
        <option>Poor</option>
      </select>
    </label>


  </div>


</div>


  <!-- CHECKBOX AREA -->

<div class="checkbox-section">

  <h4>Selection</h4>

  <div class="checkbox-options">

    <label>
      <input
        type="checkbox"
        id="heroImage">
      Hero Image
    </label>


    <label>
      <input
        type="checkbox"
        id="bookCandidate">
      Book Candidate
    </label>


    <label>
      <input
        type="checkbox"
        id="finalBook">
      Final Book
    </label>

  </div>

</div>

<!-- METADATA AREA -->

<div class="metadata-section">

  <h4>Metadata</h4>

  <div class="metadata-grid">

    <div>
      <label>Year</label>
      <span id="year"></span>
    </div>

    <div>
      <label>Photographer</label>
      <span id="photographer"></span>
    </div>

    <div>
      <label>Camera</label>
      <span id="camera"></span>
    </div>

    <div>

      <label>
        Category
      </label>

      <select id="category">

        <option></option>

        <option>Cover</option>
        <option>Where's Enos?</option>
        <option>Setup & Workshop</option>
        <option>Build Onsite</option>
        <option>Jollers & People</option>
        <option>Artworks & Burns</option>
        <option>Landscapes & Nature</option>
        <option>Nightlife & DJs</option>
        <option>Strike & Packing</option>
        <option>Portraits & Extras</option>

      </select>

    </div>

  </div>

</div>

<!-- CAPTION AREA -->

<div class="caption-section">

  <h4>Caption</h4>

  <textarea
    id="caption"
    placeholder="Book caption..."
  ></textarea>

</div>


<!-- NOTES AREA -->

<div class="notes-section">

  <h4>Notes</h4>

  <textarea
    id="notes"
    placeholder="Editing notes..."
  ></textarea>

</div>


<!-- FILE INFORMATION -->

<div class="file-section">

  <h4 id="fileName">IMG_0000.jpg</h4>

</div>


</div>

<script>


// ==========================================================
// START REVIEWER
// ==========================================================

document.addEventListener(
  "DOMContentLoaded",
  function() {

    console.log("Reviewer started");

    loadCurrentImage();

  }
);


// ==========================================================
// LOAD IMAGE DATA FROM APPS SCRIPT
// ==========================================================

function loadCurrentImage() {

  google.script.run
    .withSuccessHandler(populateReview)
    .getCurrentReviewImage();

}


// ==========================================================
// POPULATE FORM
// ==========================================================


function populateReview(data) {

  console.log(data);


  document.getElementById("imagePreview").src =
    data.imageUrl || "";


  document.getElementById("fileName").innerText =
    data.fileName || "";


  document.getElementById("imageNumber").innerText =
    data.row || "";


  document.getElementById("imageTotal").innerText =
    data.total || "";


  document.getElementById("year").innerText =
    data.metadata.year || "";


  document.getElementById("photographer").innerText =
    data.metadata.photographer || "";


  document.getElementById("camera").innerText =
    data.metadata.camera || "";


  document.getElementById("category").value =
  data.metadata.category || "";


  document.getElementById("grade").value =
    data.creative.grade || "";

  document.getElementById("selectionStage").value =
    data.creative.selectionStage || "";


  document.getElementById("storyValue").value =
    data.creative.storyValue || "";


  document.getElementById("layoutSuitability").value =
    data.creative.layoutSuitability || "";


  document.getElementById("printSuitability").value =
    data.creative.printSuitability || "";


  document.getElementById("heroImage").checked =
    data.creative.heroImage || false;


  document.getElementById("bookCandidate").checked =
    data.creative.bookCandidate || false;


  document.getElementById("finalBook").checked =
    data.creative.finalBook || false;


  document.getElementById("caption").value =
    data.creative.caption || "";


  document.getElementById("notes").value =
    data.creative.notes || "";

}

// ==========================================================
// SAVE
// ==========================================================


document
  .getElementById("saveButton")
  .addEventListener(
    "click",
    saveCurrentReview
  );


function saveCurrentReview() {


  const saveButton =
    document.getElementById("saveButton");


  const saveStatus =
    document.getElementById("saveStatus");


  const reviewData = {

  grade:
    document.getElementById("grade").value,

  selectionStage:
    document.getElementById("selectionStage").value,

  storyValue:
    document.getElementById("storyValue").value,

  layoutSuitability:
    document.getElementById("layoutSuitability").value,

  printSuitability:
    document.getElementById("printSuitability").value,

  category:
    document.getElementById("category").value,

  heroImage:
    document.getElementById("heroImage").checked,

  bookCandidate:
    document.getElementById("bookCandidate").checked,

  finalBook:
    document.getElementById("finalBook").checked,

  caption:
    document.getElementById("caption").value,

  notes:
    document.getElementById("notes").value

};


  saveButton.innerText =
    "Saving...";


  google.script.run

    .withSuccessHandler(
      function(result) {

        console.log(
          "Saved",
          result
        );


        saveButton.innerText =
          "✓ Saved";


        saveStatus.innerText =
          "Changes stored";

      }
    )


    .withFailureHandler(
      function(error) {

        console.error(error);


        saveButton.innerText =
          "Save";


        saveStatus.innerText =
          "Save failed";

      }
    )


    .saveReview(reviewData);

}

// ==========================================================
// NEXT
// ==========================================================


document
  .getElementById("nextButton")
  .addEventListener(
    "click",
    function() {


      google.script.run

        .withSuccessHandler(
          function(data) {


            document
              .getElementById("saveButton")
              .innerText =
              "Save";


            document
              .getElementById("saveStatus")
              .innerText =
              "";


            populateReview(data);


          }
        )

        .nextReviewImage();


    }
  );


// ==========================================================
// PREVIOUS
// ==========================================================


document
  .getElementById("previousButton")
  .addEventListener(
    "click",
    function() {


      google.script.run

        .withSuccessHandler(
          function(data) {


            document
              .getElementById("saveButton")
              .innerText =
              "Save";


            document
              .getElementById("saveStatus")
              .innerText =
              "";


            populateReview(data);


          }
        )

        .previousReviewImage();


    }
  );

</script>

</body>

</html>
